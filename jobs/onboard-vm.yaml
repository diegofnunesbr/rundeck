---
- name: onboard-vm
  description: |
    Integra uma VM nova recém-criada (ex.: pelo Terraform) ao ambiente:
    registra o host dinamicamente pra esse run (não precisa estar no
    inventário estático ainda) e aplica a configuração básica.

    Fecha o ciclo Terraform → cloud-init → Rundeck/Ansible: assim que o
    Terraform termina de criar a VM, chame esse job passando o IP dela.

    Idempotente: pode rodar de novo na mesma VM sem efeito colateral.
  group: onboarding
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: false
  options:
    - name: target_hosts
      required: true
      description: |
        IP ou hostname da VM nova a integrar. Não precisa já estar no
        inventário - o playbook registra dinamicamente pra esse run.
    - name: node_name
      required: false
      description: |
        Nome do node como vai aparecer no Rundeck. Se vazio, usa o
        próprio valor de target_hosts.
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - description: Integrar VM ${option.target_hosts}
        type: com.batix.rundeck.plugins.AnsiblePlaybookWorkflowStep
        nodeStep: false
        configuration:
          ansible-playbook: onboard-vm.yml
          ansible-base-dir-path: ${globals.ansible_dir}
          ansible-generate-inventory: 'false'
          ansible-disable-limit: 'true'
          ansible-extra-param: -e target_hosts=${option.target_hosts}
          ansible-ssh-user: rundeck
          ansible-ssh-key-storage-path: keys/project/foundation/ssh-key
          ansible-become: 'true'
  uuid: b4e2d3f5-9c6f-4a8b-8d1f-2e3f4a5b6c7d
