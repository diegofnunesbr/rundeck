---
apiVersion: v1
kind: Namespace
metadata:
  name: rundeck
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rundeck-data
  namespace: rundeck
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rundeck-acl
  namespace: rundeck
data:
  rundeck-admins.aclpolicy: |
    description: Admin, all access (grupo rundeck-admins do Keycloak).
    context:
      project: '.*'
    for:
      resource:
        - allow: '*'
      adhoc:
        - allow: '*'
      job:
        - allow: '*'
      node:
        - allow: '*'
      runner:
        - allow: '*'
    by:
      group: rundeck-admins

    ---

    description: Admin, all access (grupo rundeck-admins do Keycloak).
    context:
      application: 'rundeck'
    for:
      resource:
        - allow: '*'
      project:
        - allow: '*'
      project_acl:
        - allow: '*'
      storage:
        - allow: '*'
    by:
      group: rundeck-admins
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rundeck
  namespace: rundeck

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: rundeck

  template:
    metadata:
      labels:
        app: rundeck

    spec:
      containers:
        - name: rundeck
          image: rundeck-ansible:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4440

          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until [ -f /home/rundeck/etc/framework.properties ]; do sleep 1; done
                    sleep 3
                    grep -q "framework.globals.ansible_dir" /home/rundeck/etc/framework.properties || \
                      echo "framework.globals.ansible_dir = /home/rundeck/ansible" >> /home/rundeck/etc/framework.properties

          env:
            - name: PATH
              value: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

            - name: ANSIBLE_INVENTORY
              value: /home/rundeck/inventory/hosts

            - name: ANSIBLE_HOST_KEY_CHECKING
              value: "False"

            - name: RUNDECK_SERVER_ADDRESS
              value: 0.0.0.0

            - name: RUNDECK_SERVER_NAME
              value: rundeck

            - name: RUNDECK_GRAILS_URL
              value: https://rundeck.diegofnunesbr.com

            - name: RUNDECK_SERVER_FORWARDED
              value: "true"

            - name: RUNDECK_PREAUTH_ENABLED
              value: "true"

            - name: RUNDECK_PREAUTH_USERNAME_HEADER
              value: X-Forwarded-Preferred-Username

            - name: RUNDECK_PREAUTH_ROLES_HEADER
              value: X-Forwarded-Groups

            - name: RUNDECK_PREAUTH_ATTRIBUTE_NAME
              value: REMOTE_USER_GROUPS

            - name: RUNDECK_PREAUTH_DELIMITER
              value: ","

            - name: RUNDECK_PREAUTH_REDIRECT_LOGOUT
              value: "true"

            - name: RUNDECK_PREAUTH_REDIRECT_URL
              value: "/oauth2/sign_out?rd=https%3A%2F%2Fkeycloak.diegofnunesbr.com%2Frealms%2Fhome%2Fprotocol%2Fopenid-connect%2Flogout%3Fid_token_hint%3D%7Bid_token%7D%26post_logout_redirect_uri%3Dhttps%3A%2F%2Frundeck.diegofnunesbr.com"

          volumeMounts:
            - name: ssh-key
              mountPath: /home/rundeck/.ssh/rundeck
              subPath: rundeck
              readOnly: true

            - name: ansible-playbooks
              mountPath: /home/rundeck/ansible

            - name: ansible-inventory
              mountPath: /home/rundeck/inventory

            - name: rundeck-data
              mountPath: /home/rundeck/server/data

            - name: realm
              mountPath: /home/rundeck/server/config/realm.properties
              subPath: realm.properties
              readOnly: true

            - name: acl
              mountPath: /home/rundeck/etc/rundeck-admins.aclpolicy
              subPath: rundeck-admins.aclpolicy
              readOnly: true

        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          imagePullPolicy: IfNotPresent

          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:4440/
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.diegofnunesbr.com/realms/home
            - --redirect-url=https://rundeck.diegofnunesbr.com/oauth2/callback
            - --email-domain=*
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --cookie-secure=true
            - --whitelist-domain=keycloak.diegofnunesbr.com

          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: rundeck

            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rundeck-oidc
                  key: clientSecret

            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: rundeck-oidc
                  key: cookieSecret

          ports:
            - containerPort: 4180

      volumes:
        - name: ssh-key
          secret:
            secretName: rundeck-ssh-key
            defaultMode: 0440

        - name: ansible-playbooks
          hostPath:
            path: /home/diegofnunesbr/rundeck/ansible
            type: Directory

        - name: ansible-inventory
          hostPath:
            path: /home/diegofnunesbr/rundeck/inventory
            type: Directory

        - name: rundeck-data
          persistentVolumeClaim:
            claimName: rundeck-data

        - name: realm
          secret:
            secretName: rundeck-realm
            defaultMode: 0440

        - name: acl
          configMap:
            name: rundeck-acl
---
apiVersion: v1
kind: Service
metadata:
  name: rundeck
  namespace: rundeck
spec:
  type: ClusterIP
  selector:
    app: rundeck
  ports:
    - name: web
      port: 4180
      targetPort: 4180

    - name: direct
      port: 4440
      targetPort: 4440
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rundeck
  namespace: rundeck
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-clusterissuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rundeck.diegofnunesbr.com
      secretName: rundeck-tls
  rules:
    - host: rundeck.diegofnunesbr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rundeck
                port:
                  number: 4180
