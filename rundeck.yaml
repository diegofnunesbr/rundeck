---
apiVersion: v1
kind: Namespace
metadata:
  name: rundeck
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rundeck-data
  namespace: rundeck
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rundeck
  namespace: rundeck

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rundeck

  template:
    metadata:
      labels:
        app: rundeck

    spec:
      containers:
        - name: rundeck
          image: rundeck-ansible:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4440

          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until [ -f /home/rundeck/etc/framework.properties ]; do sleep 1; done
                    sleep 3
                    grep -q "framework.globals.ansible_dir" /home/rundeck/etc/framework.properties || \
                      echo "framework.globals.ansible_dir = /home/rundeck/ansible" >> /home/rundeck/etc/framework.properties

          env:
            - name: PATH
              value: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

            - name: ANSIBLE_INVENTORY
              value: /home/rundeck/inventory/hosts

            - name: ANSIBLE_HOST_KEY_CHECKING
              value: "False"

            - name: RUNDECK_SERVER_ADDRESS
              value: 0.0.0.0

            - name: RUNDECK_SERVER_NAME
              value: rundeck

            - name: RUNDECK_GRAILS_URL
              value: https://rundeck.diegofnunesbr.com

            - name: RUNDECK_SERVER_FORWARDED
              value: "true"

          volumeMounts:
            - name: ssh-key
              mountPath: /home/rundeck/.ssh/rundeck
              subPath: rundeck
              readOnly: true

            - name: ansible-playbooks
              mountPath: /home/rundeck/ansible

            - name: ansible-inventory
              mountPath: /home/rundeck/inventory

            - name: rundeck-data
              mountPath: /home/rundeck/server/data

            - name: realm
              mountPath: /home/rundeck/server/config/realm.properties
              subPath: realm.properties
              readOnly: true

            - name: alloy-push-password
              mountPath: /etc/alloy-push-password
              readOnly: true

      volumes:
        - name: ssh-key
          secret:
            secretName: rundeck-ssh-key
            defaultMode: 0440

        - name: ansible-playbooks
          hostPath:
            path: /home/diegofnunesbr/rundeck/ansible
            type: Directory

        - name: ansible-inventory
          hostPath:
            path: /home/diegofnunesbr/rundeck/inventory
            type: Directory

        - name: rundeck-data
          persistentVolumeClaim:
            claimName: rundeck-data

        - name: realm
          secret:
            secretName: rundeck-realm
            defaultMode: 0440

        - name: alloy-push-password
          secret:
            secretName: alloy-push-password
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: rundeck
  namespace: rundeck
spec:
  type: ClusterIP
  selector:
    app: rundeck
  ports:
    - port: 4440
      targetPort: 4440
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rundeck
  namespace: rundeck
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-clusterissuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rundeck.diegofnunesbr.com
      secretName: rundeck-tls
  rules:
    - host: rundeck.diegofnunesbr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rundeck
                port:
                  number: 4440
