---
- import_playbook: _stage_target.yml

- name: Instalar Grafana Alloy e node_exporter
  hosts: "{{ target_hosts }}"
  become: true
  vars:
    mimir_remote_write_url: "{{ globals_mimir_remote_write_url | default('https://mimir.diegofnunesbr.com/api/v1/push') }}"
    alloy_push_password_source: /etc/alloy-push-password/password
  tasks:
    - name: Instalar node_exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Habilitar e iniciar node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Adicionar chave GPG do repositório da Grafana
      ansible.builtin.apt_key:
        url: https://apt.grafana.com/gpg.key
        state: present

    - name: Adicionar repositório APT da Grafana
      ansible.builtin.apt_repository:
        repo: deb https://apt.grafana.com stable main
        filename: grafana
        state: present

    - name: Instalar Grafana Alloy
      ansible.builtin.apt:
        name: alloy
        state: present
        update_cache: true

    - name: Copiar senha de envio pro Mimir
      ansible.builtin.copy:
        src: "{{ alloy_push_password_source }}"
        dest: /etc/alloy/push-password
        owner: alloy
        group: alloy
        mode: "0600"
      notify: Reiniciar Alloy

    - name: Renderizar /etc/alloy/config.alloy
      ansible.builtin.template:
        src: templates/config.alloy.j2
        dest: /etc/alloy/config.alloy
        mode: "0644"
      notify: Reiniciar Alloy

    - name: Habilitar e iniciar Alloy
      ansible.builtin.systemd:
        name: alloy
        enabled: true
        state: started

  handlers:
    - name: Reiniciar Alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted
